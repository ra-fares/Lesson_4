<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Власть верующего (урок 4)</title>
<style>body{font:18px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#243447;background:#f6f8fb}main{text-align:center;max-width:560px;padding:24px}p{color:#526277}</style>
</head>
<body>
<main id="status"><h1>Власть верующего (урок 4)</h1><p>Загрузка урока и иллюстраций…</p></main>
<script>
(async function () {
  const status = document.getElementById('status');
  try {
    const response = await fetch('./lesson-source.html');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let page = await response.text();
    const start = page.indexOf('<!DOCTYPE html>');
    if (start < 0 || !page.includes('<title>Власть верующего (урок 4)</title>')) {
      throw new Error('Не найден оригинальный документ');
    }
    page = page.slice(start).trimEnd();
    // Offline single-file Obsidian export: no metadata.json is available on GitHub Pages.
    page = page.replace('this.isHttp="file:"!=window.location.protocol', 'this.isHttp=!1');
    if (!page.includes('this.isHttp=!1')) throw new Error('Не удалось включить автономный режим');
    // Table-of-contents links should target anchors on the current page.
    page = page.replaceAll('href="Власть верующего (урок 4).html#', 'href="#');
    document.open();
    document.write(page);
    document.close();
    document.addEventListener('click', function (event) {
      const anchor = event.target.closest('a[href^="#"]');
      if (!anchor) return;
      const id = decodeURIComponent(anchor.getAttribute('href').slice(1));
      const heading = document.getElementById(id);
      if (!heading) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      history.replaceState(null, '', '#' + encodeURIComponent(id));
      heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, true);
  } catch (error) {
    status.innerHTML = '<h1>Не удалось открыть урок</h1><p>Проверьте публикацию GitHub Pages и обновите страницу.</p>';
    console.error('Lesson loader:', error);
  }
})();
</script>
</body>
</html>
